<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bag Bazar | Login</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="login-body">

<header class="header">
  <div class="topbar">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>

    <div class="logo">
      <i class="fa-solid fa-bag-shopping"></i>
      <h2>Bag <span>Bazar</span></h2>
    </div>

    <div style="width:24px;"></div>
  </div>
</header>

<main class="login-page">

  <div class="login-card">

    <h1>Welcome Back</h1>
    <p>Login to your Bag Bazar account</p>

    <div class="tab-buttons">
      <button class="tab active" id="loginTab">Login</button>
      <button class="tab" id="registerTab">Register</button>
    </div>

    <form id="loginForm" class="auth-form">

      <label>Email</label>
      <input type="email" id="loginEmail" required>

      <label>Password</label>
      <input type="password" id="loginPassword" required>

      <button type="submit" class="auth-btn">
        Login
      </button>

    </form>
        <form id="registerForm" class="auth-form hidden">

      <label>Full Name</label>
      <input type="text" id="regName" required>

      <label>Phone Number</label>
      <input type="tel" id="regPhone" required>

      <label>Email</label>
      <input type="email" id="regEmail" required>

      <label>Password</label>
      <input type="password" id="regPassword" required>

      <label>Confirm Password</label>
      <input type="password" id="regConfirm" required>

      <button type="submit" class="auth-btn">
        Create Account
      </button>

    </form>

    <p class="auth-note">
      By continuing, you agree to Bag Bazar Terms & Privacy Policy.
    </p>
  </div>
  </main>

<nav class="bottom-nav">

  <a href="index.html">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </a>

  <a href="wishlist.html">
    <i class="fa-regular fa-heart"></i>
    <span>Wishlist</span>
  </a>

  <a href="cart.html">
    <i class="fa-solid fa-cart-shopping"></i>
    <span>Cart</span>
  </a>

  <a href="login.html" class="active">
    <i class="fa-regular fa-user"></i>
    <span>Account</span>
  </a>

</nav>

<script src="login.js"></script>

</body>
</html>
