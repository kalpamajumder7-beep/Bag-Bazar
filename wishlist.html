<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bag Bazar | Wishlist</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="wishlist-body">

<header class="header">
  <div class="topbar">

    <a href="index.html">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="logo">
      <i class="fa-solid fa-bag-shopping"></i>
      <h2>Bag <span>Bazar</span></h2>
    </div>

    <a href="cart.html" class="cart-icon">
      <i class="fa-solid fa-cart-shopping"></i>
      <span id="cartCount">0</span>
    </a>

  </div>
</header>

<main class="wishlist-page">

  <div class="page-title">
    <h1>My Wishlist</h1>
    <p>Your saved favorite bags</p>
  </div>

  <div id="wishlistItems" class="wishlist-items">
    <!-- Products will load here -->
  </div>
    <section class="wishlist-summary">

    <div class="summary-box">
      <h2>Saved Items</h2>
      <span id="wishCount">0</span>
    </div>

  </section>

  <div class="wishlist-actions">

    <button id="clearWishlist" class="clear-btn">
      Clear Wishlist
    </button>

    <a href="index.html" class="shop-btn">
      Continue Shopping
    </a>

  </div>
  </main>

<footer class="footer">

  <div class="footer-main">

    <div class="brand">
      <h2>Bag <span>Bazar</span></h2>
      <p>Premium Bags in Bangladesh</p>
    </div>

    <div class="contact">
      <p>📍 Lakshmipur, Bangladesh</p>
      <p>✉ support@bagbazar.com</p>
      <p>☎ +8801XXXXXXXXX</p>
    </div>

  </div>

  <p class="copy">
    © 2026 Bag Bazar. All Rights Reserved.
  </p>

</footer>

<nav class="bottom-nav">

  <a href="index.html">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </a>

  <a href="wishlist.html" class="active">
    <i class="fa-regular fa-heart"></i>
    <span>Wishlist</span>
  </a>

  <a href="cart.html">
    <i class="fa-solid fa-cart-shopping"></i>
    <span>Cart</span>
  </a>

  <a href="login.html">
    <i class="fa-regular fa-user"></i>
    <span>Account</span>
  </a>

</nav>

<script src="wishlist.js"></script>

</body>
</html>
