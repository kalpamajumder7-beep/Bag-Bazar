<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bag Bazar</title>
<style>
body{font-family:Arial;margin:0;background:#f3f3f3}
header{background:#111;color:#fff;padding:15px;text-align:center}
nav{display:flex;overflow:auto;background:#fff}
nav button{flex:1;padding:10px;border:none;background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;border-radius:10px;overflow:hidden}
img{width:100%;height:140px;object-fit:cover}
.info{padding:8px}
button.buy{width:100%;background:#111;color:#fff;border:none;padding:8px}
#cart{position:fixed;right:10px;bottom:10px;background:#111;color:#fff;padding:12px;border-radius:30px}
#admin,#checkout{display:none;background:#fff;padding:12px}
input,select{width:100%;padding:8px;margin:5px 0}
</style>
</head>
<body>

<header>
<h2>👜 Bag Bazar</h2>
</header>

<nav>
<button onclick="filter('All')">All</button>
<button onclick="filter('Ladies')">Ladies</button>
<button onclick="filter('College')">College</button>
<button onclick="filter('Backpack')">Backpack</button>
<button onclick="filter('Travel')">Travel</button>
</nav>

<div id="products" class="grid"></div>

<div id="admin">
<h3>Admin Panel</h3>
<input id="name" placeholder="Bag name">
<input id="price" placeholder="Price">
<input id="img" placeholder="Image URL">
<select id="cat">
<option>Ladies</option>
<option>College</option>
<option>Backpack</option>
<option>Travel</option>
</select>
<button onclick="addProduct()">Add Product</button>
</div>

<div id="checkout">
<h3>Checkout</h3>
<input placeholder="Name">
<input placeholder="Phone">
<input placeholder="Address">
<button>Place Order</button>
</div>

<div id="cart" onclick="openCheckout()">
Cart (<span id="count">0</span>)
</div>

<script>
let cart=0;
let products=JSON.parse(localStorage.getItem("bags"))||[
{name:"Leather Ladies Bag",price:1200,cat:"Ladies",img:"https://placehold.co/300x200?text=Ladies"},
{name:"College Backpack",price:1500,cat:"College",img:"https://placehold.co/300x200?text=College"},
{name:"Travel Duffel",price:1900,cat:"Travel",img:"https://placehold.co/300x200?text=Travel"}
];

function save(){localStorage.setItem("bags",JSON.stringify(products))}
function show(list){
let box=document.getElementById("products");
box.innerHTML="";
list.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<div class="info">
<b>${p.name}</b><br>
৳${p.price}<br><small>${p.cat}</small>
<button class="buy" onclick="cart++;count.innerText=cart">Add to Cart</button>
<button onclick="del(${i})">Delete</button>
</div></div>`;
});
}
function filter(c){
if(c=="All")show(products);
else show(products.filter(x=>x.cat==c));
}
function addProduct(){
products.push({
name:name.value,
price:price.value,
img:img.value,
cat:cat.value
});
save(); filter("All");
name.value=price.value=img.value="";
}
function del(i){
products.splice(i,1);
save(); filter("All");
}
function openCheckout(){
checkout.style.display="block";
window.scrollTo(0,document.body.scrollHeight);
}
show(products);

let pass=prompt("Admin? Type 1234 or Cancel");
if(pass=="1234") admin.style.display="block";
</script>

</body>
</html>
