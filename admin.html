<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bag Bazar Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>Admin Panel</h2>
</header>

<div style="padding:15px;">
  <input id="name" placeholder="Bag Name"><br><br>
  <input id="price" placeholder="Price"><br><br>
  <input id="image" placeholder="Image URL"><br><br>

  <select id="category">
    <option>Ladies</option>
    <option>College</option>
    <option>Backpack</option>
    <option>Travel</option>
  </select><br><br>

  <button class="buy" onclick="addProduct()">Add Product</button>
</div>

<script src="admin.js"></script>
</body>
</html>
