<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bag Bazar | Profile</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="profile-body">

<header class="header">
  <div class="topbar">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>

    <div class="logo">
      <i class="fa-solid fa-bag-shopping"></i>
      <h2>Bag <span>Bazar</span></h2>
    </div>

    <div style="width:24px;"></div>
  </div>
</header>

<main class="profile-page">

  <div class="profile-card">
    <div class="avatar">
      <i class="fa-solid fa-user"></i>
    </div>

    <h2 id="userName">Guest User</h2>
    <p id="userEmail">example@email.com</p>
    <p id="userPhone">+8801XXXXXXXXX</p>
  </div>

  <div class="order-section">
    <h2>My Orders</h2>

    <div id="orderList" class="order-list">
      <!-- Orders load here -->
    </div>
  </div>
    <div class="profile-menu">

    <a href="wishlist.html" class="menu-item">
      <i class="fa-regular fa-heart"></i>
      <span>My Wishlist</span>
      <i class="fa-solid fa-chevron-right"></i>
    </a>

    <a href="cart.html" class="menu-item">
      <i class="fa-solid fa-cart-shopping"></i>
      <span>My Cart</span>
      <i class="fa-solid fa-chevron-right"></i>
    </a>

    <a href="checkout.html" class="menu-item">
      <i class="fa-solid fa-box"></i>
      <span>Checkout</span>
      <i class="fa-solid fa-chevron-right"></i>
    </a>

  </div>

  <button id="logoutBtn" class="logout-btn">
    <i class="fa-solid fa-right-from-bracket"></i>
    Logout
  </button>
  </main>

<nav class="bottom-nav">

  <a href="index.html">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </a>

  <a href="wishlist.html">
    <i class="fa-regular fa-heart"></i>
    <span>Wishlist</span>
  </a>

  <a href="cart.html">
    <i class="fa-solid fa-cart-shopping"></i>
    <span>Cart</span>
  </a>

  <a href="profile.html" class="active">
    <i class="fa-regular fa-user"></i>
    <span>Account</span>
  </a>

</nav>

<script src="profile.js"></script>

</body>
</html>
